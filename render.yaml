# Render Blueprint — COHEP (NestJS backend + Next.js frontend + Postgres)

databases:
  - name: niangelos-db
    databaseName: niangelos
    user: niangelos
    plan: free
    postgresMajorVersion: 15

services:
  # ── Backend API (NestJS) ─────────────────────────────────────────────────
  - type: web
    name: niangelos-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: mkdir -p uploads && npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run seed && npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: niangelos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO_USERS
        value: 'false'
      - key: FRONTEND_URL
        value: https://cohep-platform.vercel.app
      - key: APP_URL
        value: https://cohep-platform.vercel.app
      - key: SENDGRID_API_KEY
        sync: false
      - key: MAIL_FROM
        value: amir.adly1@gmail.com
      - key: MAIL_TO
        value: amir.adly1@gmail.com
      - key: GEMINI_MODEL
        value: gemini-1.5-flash

# Frontend is hosted on Vercel (cohep-platform.vercel.app) — intentionally not
# deployed here. A duplicate Render copy caused CORS-blocked API calls (only
# the Vercel origin is allowlisted in the backend) and wasted free-tier build
# hours on a service nobody used.
