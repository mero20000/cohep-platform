# Render Blueprint — NiAngelos backend (NestJS + Postgres)
# Use this render.yaml when the repo contains ONLY the backend
# (i.e. the contents of the backend/ folder are at the repo root).

databases:
  - name: niangelos-db
    databaseName: niangelos
    user: niangelos
    plan: free
    postgresMajorVersion: 15

services:
  - type: web
    name: niangelos-backend
    runtime: node
    rootDir: .
    plan: free
    region: oregon
    buildCommand: mkdir -p uploads/audio && npm install && npm run build
    # Free tier has no pre-deploy hook, so run migrations + seed on every start.
    # Idempotent: migrate applies only new migrations, seed upserts roles/admin.
    startCommand: npx prisma migrate deploy && npm run seed && npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: niangelos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO_USERS
        value: 'false'
      - key: FRONTEND_URL
        value: https://cohep-platform.vercel.app
      # Persistent audio storage (R2). When set, recordings upload to R2 and are
      # served from the CDN; when unset they fall back to the ephemeral local
      # disk and are LOST on every deploy. Set these in the Render dashboard.
      - key: CLOUDFLARE_R2_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_BUCKET
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_PUBLIC_URL
        sync: false
      # WhatsApp parent-awareness (Meta Cloud API). When unset, notifications
      # degrade to in-app only.
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      # Render injects PORT automatically; main.ts listens on process.env.PORT.
